<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Central Pharmacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="account">
  <div class="proto-banner">Prototype account — information is stored only in this browser.</div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt=""><span>Central Pharmacy</span></a>
      <button class="icon-btn menu-toggle" type="button" data-menu-toggle>Menu</button>
      <nav class="nav" data-nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="prescriptions.html">Prescriptions</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a class="is-active" href="account.html">Account</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="header-actions">
        <a class="icon-btn" href="cart.html">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
      </div>
    </div>
  </header>

  <main class="container page-hero" data-account>
    <p class="eyebrow">Customer</p>
    <h1>Your account</h1>
    <div class="layout-2">
      <aside class="card side-nav">
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="prescriptions">Prescriptions</button>
        <button type="button" data-tab="profile">Profile</button>
      </aside>
      <div>
        <section class="card" data-tab-panel="orders">
          <h2>Orders</h2>
          <div data-orders></div>
        </section>
        <section class="card" data-tab-panel="prescriptions" hidden>
          <h2>Prescriptions</h2>
          <div data-rx-list></div>
        </section>
        <section class="card" data-tab-panel="profile" hidden>
          <h2>Profile</h2>
          <p class="help">Use sample details only.</p>
          <form data-profile>
            <div class="field"><label for="fullName">Name</label><input id="fullName" name="fullName"></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" name="phone"></div>
            <div class="field"><label for="address">Address</label><textarea id="address" name="address" rows="3"></textarea></div>
            <button class="btn btn-primary" type="submit">Save profile</button>
            <p class="alert-ok" data-profile-saved hidden>Saved in this browser.</p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container legal">© <span data-year></span> Central Pharmacy prototype</div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
